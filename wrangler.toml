name = "anime-counter"
main = "src/index.ts"
compatibility_date = "2024-12-05"

# Build step: bundles sprite assets into src/generated/
[build]
command = "node scripts/build-themes.mjs"
watch_dir = "src/assets"

# KV Namespace binding (default / backward compatible)
# Existing user counts remain safe and uninterrupted in KV
[[kv_namespaces]]
binding = "KV"
id = "127cc06ce77f44d1b14b9e542157690b"

# Optional Cloudflare D1 database binding
# To upgrade to D1, create DB with: npx wrangler d1 create anime-counter
# [[d1_databases]]
# binding = "DB"
# database_name = "anime-counter"
# database_id = "your-d1-database-id"
# migrations_dir = "migrations"

# Optional: per-username rate limiter binding
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 300, period = 60 }
